name: Nandark Auto Deploy & Cache Purge

on:
  push:
    branches:
      - main

env:
  SITE: https://darkturquoise-vulture-577559.hostingersite.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leer la versión que estamos desplegando
        id: ver
        run: |
          VERSION=$(grep -m1 -E '^\s*\*\s*Version:' nandark-atomic-core.php | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "::error::No se pudo leer la Version del header de nandark-atomic-core.php"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Desplegando v$VERSION"

      - name: Disparar self-update desde la rama main
        env:
          DEPLOY_TOKEN: ${{ secrets.NANDARK_DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::Falta el secret NANDARK_DEPLOY_TOKEN."
            exit 1
          fi

          # source=main: instala lo último de la rama, sin exigir un GitHub Release.
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            "$SITE/wp-json/nandark/v1/self-update?source=main")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Body:   $BODY"
          echo "Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::self-update devolvió $HTTP_STATUS"
            exit 1
          fi

          # Un 200 NO alcanza: el endpoint responde 200 con updated:false cuando
          # decide no tocar nada. Sin este chequeo el deploy "pasa" sin desplegar.
          if echo "$BODY" | grep -q '"updated":false'; then
            echo "::warning::El servidor dice que ya estaba al día. No se instaló nada."
          fi

      - name: Purgar caché de LiteSpeed vía MCP
        env:
          MCP_TOKEN: ${{ secrets.WP_MCP_TOKEN }}
        run: |
          if [ -z "$MCP_TOKEN" ]; then
            echo "Sin WP_MCP_TOKEN: se saltea el purgado."
            exit 0
          fi

          MCP="$SITE/wp-json/mcp/mcp-adapter-default-server"
          # El header Accept es obligatorio en streamable HTTP; sin él el server
          # puede rechazar el handshake.
          ACCEPT="application/json, text/event-stream"

          SESSION_ID=$(curl -s -D - -o /dev/null -X POST "$MCP" \
            -H "Authorization: Bearer $MCP_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: $ACCEPT" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"github-actions","version":"1.0"}}}' \
            | grep -i "mcp-session-id" | tr -d '\r' | awk '{print $2}')

          if [ -z "$SESSION_ID" ]; then
            echo "::warning::No se obtuvo Mcp-Session-Id. Se saltea el purgado."
            exit 0
          fi

          curl -s -o /dev/null -X POST "$MCP" \
            -H "Authorization: Bearer $MCP_TOKEN" -H "Content-Type: application/json" \
            -H "Accept: $ACCEPT" -H "Mcp-Session-Id: $SESSION_ID" \
            -d '{"jsonrpc":"2.0","method":"notifications/initialized"}'

          curl -s -X POST "$MCP" \
            -H "Authorization: Bearer $MCP_TOKEN" -H "Content-Type: application/json" \
            -H "Accept: $ACCEPT" -H "Mcp-Session-Id: $SESSION_ID" \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"mcp-adapter-execute-ability","arguments":{"ability_name":"ewpa/clear-cache","parameters":{}}}}'
          echo "Caché purgada."

      - name: Verificar que la versión NUEVA esté sirviendo
        run: |
          EXPECTED="${{ steps.ver.outputs.version }}"

          # Cache-buster: LiteSpeed puede servir HTML viejo y hacer pasar un
          # deploy que nunca ocurrió. Un 200 en / no prueba absolutamente nada.
          LIVE=$(curl -s "$SITE/wp-json/nandark/v1/config?cb=$GITHUB_RUN_ID" \
                 | grep -o '"version":"[^"]*"' | cut -d'"' -f4)

          echo "esperada: $EXPECTED | en el sitio: ${LIVE:-<sin respuesta>}"

          if [ "$LIVE" != "$EXPECTED" ]; then
            echo "::error::El sitio sirve '$LIVE' y esperábamos '$EXPECTED'. El deploy NO llegó."
            exit 1
          fi

          HOME_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SITE/?cb=$GITHUB_RUN_ID")
          if [ "$HOME_STATUS" -ne 200 ]; then
            echo "::error::La home devolvió $HOME_STATUS"
            exit 1
          fi

          echo "Deploy verificado: v$EXPECTED sirviendo y home en 200."
