name: Nandark Auto Deploy & Cache Purge

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Remote Self-Update
        env:
          DEPLOY_TOKEN: ${{ secrets.NANDARK_DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::NANDARK_DEPLOY_TOKEN secret is not set in GitHub repository secrets."
            exit 1
          fi

          echo "Disparando self-update en Hostinger..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            "https://darkturquoise-vulture-577559.hostingersite.com/wp-json/nandark/v1/self-update")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response Body: $BODY"
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Self-update failed with status $HTTP_STATUS"
            exit 1
          fi

      - name: Purge LiteSpeed Cache via MCP
        env:
          MCP_TOKEN: ${{ secrets.WP_MCP_TOKEN }}
        run: |
          if [ -z "$MCP_TOKEN" ]; then
            echo "MCP token not configured, skipping automated cache purge."
            exit 0
          fi

          echo "Purgando caché de LiteSpeed vía MCP..."
          INIT_RESP=$(curl -s -i -X POST \
            -H "Authorization: Bearer $MCP_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"capabilities": {}, "protocolVersion": "2024-11-05", "clientInfo": {"name": "github-actions", "version": "1.0"}}}' \
            "https://darkturquoise-vulture-577559.hostingersite.com/wp-json/mcp/mcp-adapter-default-server")

          SESSION_ID=$(echo "$INIT_RESP" | grep -i "mcp-session-id:" | tr -d '\r' | awk '{print $2}')

          if [ -n "$SESSION_ID" ]; then
            curl -s -X POST \
              -H "Authorization: Bearer $MCP_TOKEN" \
              -H "Mcp-Session-Id: $SESSION_ID" \
              -H "Content-Type: application/json" \
              -d '{"jsonrpc": "2.0", "id": 2, "method": "tools/call", "params": {"name": "mcp-adapter-execute-ability", "arguments": {"ability_name": "ewpa/clear-cache", "parameters": {}}}}' \
              "https://darkturquoise-vulture-577559.hostingersite.com/wp-json/mcp/mcp-adapter-default-server"
            echo "Cache purge triggered successfully."
          fi

      - name: Verify Live Site Status
        run: |
          echo "Verificando respuesta del sitio..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://darkturquoise-vulture-577559.hostingersite.com/")
          echo "Live Site HTTP Status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "::error::Site did not return 200 OK after deploy."
            exit 1
          fi
          echo "Deploy y verificación completados con éxito."
